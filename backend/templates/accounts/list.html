<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Accounts</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:10px;text-align:left;}</style>
  </head>
  <body>
    <h1>Accounts</h1>
    <table>
      <thead>
        <tr><th>Username</th><th>Email</th><th>Role</th><th>Created</th></tr>
      </thead>
      <tbody>
        {% for account in accounts %}
          <tr>
            <td><a href="{{ account.id }}/">{{ account.username }}</a></td>
            <td>{{ account.email }}</td>
            <td>{{ account.role }}</td>
            <td>{{ account.created_at|date:'Y-m-d H:i' }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="4">No accounts available.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
