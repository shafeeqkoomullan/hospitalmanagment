<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Patients</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:10px;}</style>
  </head>
  <body>
    <h1>Patients</h1>
    <table>
      <thead>
        <tr><th>Name</th><th>Age</th><th>Condition</th><th>Admitted</th></tr>
      </thead>
      <tbody>
        {% for patient in patients %}
          <tr>
            <td><a href="{{ patient.id }}/">{{ patient.name }}</a></td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.condition }}</td>
            <td>{{ patient.admitted|yesno:'Yes,No' }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="4">No patients found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
