<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ patient.name }}</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}dl{display:grid;grid-template-columns:120px 1fr;gap:8px;}dt{font-weight:bold;}</style>
  </head>
  <body>
    <h1>{{ patient.name }}</h1>
    <dl>
      <dt>Age</dt><dd>{{ patient.age }}</dd>
      <dt>Condition</dt><dd>{{ patient.condition }}</dd>
      <dt>Admitted</dt><dd>{{ patient.admitted|yesno:'Yes,No' }}</dd>
      <dt>Notes</dt><dd>{{ patient.notes|default:'—' }}</dd>
    </dl>
    <p><a href="/patients/">Back to patients</a></p>
  </body>
</html>
