<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Management Website</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 32px; background: #f9fafb; color: #111827; }
      h1 { margin-bottom: 0.5rem; }

  <body>
    <h1>Hospital Management Website</h1>
    <p>Use the links below to explore the Django apps for each role.</p>
    <div class="grid">
      <div class="card"><a href="/accounts/">Accounts App</a></div>
      <div class="card"><a href="/hospital-admin/">Admin App</a></div>
      <div class="card"><a href="/reception/">Receptionist App</a></div>
      <div class="card"><a href="/patients/">Patient App</a></div>
      <div class="card"><a href="/doctors/">Doctor App</a></div>
      <div class="card"><a href="/billing/">Billing App</a></div>
    </div>
  </body>
</html>
