<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ notice.title }}</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}section{padding:18px;border:1px solid #ddd;border-radius:10px;}</style>
  </head>
  <body>
    <section>
      <h1>{{ notice.title }}</h1>
      <p><strong>Published</strong>: {{ notice.published_at|date:'Y-m-d H:i' }}</p>
      <div>{{ notice.content }}</div>
    </section>
    <p><a href="/hospital-admin/">Back to admin notices</a></p>
  </body>
</html>
