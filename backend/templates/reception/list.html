<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reception Tasks</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}li{margin-bottom:12px;}</style>
  </head>
  <body>
    <h1>Reception Tasks</h1>
    <ul>
      {% for task in tasks %}
        <li>
          <a href="{{ task.id }}/">{{ task.title }}</a> • {{ task.status }}
        </li>
      {% empty %}
        <li>No tasks available.</li>
      {% endfor %}
    </ul>
  </body>
</html>
