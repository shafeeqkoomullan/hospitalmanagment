<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ task.title }}</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}section{padding:18px;border:1px solid #ddd;border-radius:10px;}</style>
  </head>
  <body>
    <section>
      <h1>{{ task.title }}</h1>
      <p><strong>Status:</strong> {{ task.status }}</p>
      <p>{{ task.description }}</p>
      <p><em>Assigned at: {{ task.assigned_at|date:'Y-m-d H:i' }}</em></p>
    </section>
    <p><a href="/reception/">Back to tasks</a></p>
  </body>
</html>
