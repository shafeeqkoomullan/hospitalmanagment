<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doctors</title>
    <style>body{font-family:Arial,sans-serif;margin:24px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:10px;}</style>
  </head>
  <body>
    <h1>Doctors</h1>
    <table>
      <thead>
        <tr><th>Name</th><th>Specialty</th><th>Department</th><th>Available</th></tr>
      </thead>
      <tbody>
        {% for doctor in doctors %}
          <tr>
            <td><a href="{{ doctor.id }}/">{{ doctor.name }}</a></td>
            <td>{{ doctor.specialty }}</td>
            <td>{{ doctor.department|default:'General' }}</td>
            <td>{{ doctor.available|yesno:'Yes,No' }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="4">No doctors registered.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
